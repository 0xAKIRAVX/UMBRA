[package]
name = "umbra-core"
version = "4.0.0"
edition = "2021"
description = "UMBRA native scan core: WireGuard handshake + UDP endpoint probe engine (pure Rust, zero dependencies)"

[lib]
name = "umbra_core"
crate-type = ["staticlib", "rlib"]

# Keep unwind (default) so the JNI boundary can catch_unwind; panics must never cross FFI.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
