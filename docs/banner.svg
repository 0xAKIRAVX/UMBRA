<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="UMBRA — Cloudflare & WARP endpoint scanner for Android">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="0.55" stop-color="#0d1420"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5d4"/>
      <stop offset="0.5" stop-color="#9b5de5"/>
      <stop offset="1" stop-color="#f15bb5"/>
    </linearGradient>
    <radialGradient id="orba" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00f5d4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9b5de5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9b5de5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f15bb5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f15bb5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f5d4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9b5de5" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="130" cy="70" r="170" fill="url(#orba)"/>
  <circle cx="1090" cy="250" r="200" fill="url(#orbb)"/>
  <circle cx="620" cy="330" r="150" fill="url(#orbc)"/>

  <!-- radar emblem -->
  <g transform="translate(185 150)" filter="url(#glow)">
    <circle r="70" fill="none" stroke="url(#ring)" stroke-width="1.6" opacity="0.35"/>
    <circle r="48" fill="none" stroke="url(#ring)" stroke-width="1.6" opacity="0.55"/>
    <circle r="26" fill="none" stroke="url(#ring)" stroke-width="1.6" opacity="0.8"/>
    <path d="M0 0 L66 -22" stroke="#00f5d4" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M0 0 L-20 62" stroke="#9b5de5" stroke-width="2.4" stroke-linecap="round"/>
    <circle r="5" fill="#00f5d4"/>
    <circle cx="66" cy="-22" r="4.5" fill="#f15bb5"/>
    <circle cx="-20" cy="62" r="4.5" fill="#f15bb5"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(330 168)" filter="url(#glow)" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="104" letter-spacing="22">
    <text fill="url(#title)">UMBRA</text>
  </g>
  <text x="336" y="212" fill="#7d8590" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" letter-spacing="6">CLOUDFLARE · WARP ENDPOINT SCANNER</text>

  <!-- right-side signal ticks -->
  <g stroke="#00f5d4" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="1010" y1="150" x2="1024" y2="150"/>
    <line x1="1010" y1="132" x2="1018" y2="132" opacity="0.7"/>
    <line x1="1010" y1="168" x2="1018" y2="168" opacity="0.7"/>
    <line x1="1010" y1="114" x2="1012" y2="114" opacity="0.5"/>
    <line x1="1010" y1="186" x2="1012" y2="186" opacity="0.5"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#1c2733" stroke-width="1"/>
</svg>
